<svg xmlns="http://www.w3.org/2000/svg" width="760" height="557" viewBox="0 0 760 557" role="img" aria-label="Info card">
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 14.5px;
      dominant-baseline: alphabetic;
    }
    .hdr { font-size: 17.0px; font-weight: 700; }
    .k   { fill: #58a6ff; font-weight: 600; }
    .v   { fill: #c9d1d9; }
    @keyframes ln {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .ln { opacity: 0; animation: ln 0.42s cubic-bezier(.2,.8,.3,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; opacity: 1; }
    }
  </style>
  <rect width="100%" height="100%" rx="10" fill="#0d1117" stroke="#21262d"/>
  
<text x="26" y="48.0" class="hdr ln" style="animation-delay:0.35s"><tspan fill="#39d353">taha</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#58a6ff">github</tspan></text>  <line x1="26" y1="58.0" x2="734" y2="58.0" stroke="#30363d" class="ln" style="animation-delay:0.41s"/>  <text x="26" y="82.0" class="k ln" style="animation-delay:0.47s">Now</text><text x="144" y="82.0" class="v ln" style="animation-delay:0.47s">Frontend Engineer at Matrixs Group</text>  <text x="26" y="106.0" class="k ln" style="animation-delay:0.53s">Prev</text><text x="144" y="106.0" class="v ln" style="animation-delay:0.53s">Freelance Frontend Developer</text>  <text x="26" y="130.0" class="k ln" style="animation-delay:0.59s">Uptime</text><text x="144" y="130.0" class="v ln" style="animation-delay:0.59s">3 years in production</text>  <text x="26" y="154.0" class="k ln" style="animation-delay:0.65s">Location</text><text x="144" y="154.0" class="v ln" style="animation-delay:0.65s">Saudi Arabia</text>  <text x="26" y="178.0" class="k ln" style="animation-delay:0.71s">Degree</text><text x="144" y="178.0" class="v ln" style="animation-delay:0.71s">Diploma of Information Technology, JICC</text>  <text x="26" y="212.8" class="k ln" style="animation-delay:0.77s">Core</text><text x="144" y="212.8" class="v ln" style="animation-delay:0.77s">React, Next.js, Angular, TypeScript</text>  <text x="26" y="236.8" class="k ln" style="animation-delay:0.83s">State</text><text x="144" y="236.8" class="v ln" style="animation-delay:0.83s">Redux Toolkit, Zustand, TanStack Query</text>  <text x="26" y="260.8" class="k ln" style="animation-delay:0.89s">UI</text><text x="144" y="260.8" class="v ln" style="animation-delay:0.89s">Tailwind CSS, Sass, React Hook Form, Zod</text>  <text x="26" y="284.8" class="k ln" style="animation-delay:0.95s">Data</text><text x="144" y="284.8" class="v ln" style="animation-delay:0.95s">Firebase, REST APIs, SignalR</text>  <text x="26" y="308.8" class="k ln" style="animation-delay:1.01s">Ship</text><text x="144" y="308.8" class="v ln" style="animation-delay:1.01s">Git, Vercel, GitHub Actions</text>  <text x="26" y="343.6" class="k ln" style="animation-delay:1.07s">Shipped</text>  <text x="40" y="367.6" class="v ln" style="animation-delay:1.13s"><tspan fill="#39d353">&#9642; </tspan>ERP platform in Next.js: HR, CRM, projects, dashboards</text>  <text x="40" y="391.6" class="v ln" style="animation-delay:1.19s"><tspan fill="#39d353">&#9642; </tspan>Website builder with 22+ configurable components</text>  <text x="40" y="415.6" class="v ln" style="animation-delay:1.25s"><tspan fill="#39d353">&#9642; </tspan>Restaurant POS in Angular, ZATCA Phase 2, live deploys</text>  <text x="40" y="439.6" class="v ln" style="animation-delay:1.31s"><tspan fill="#39d353">&#9642; </tspan>.NET local printing service, replaced a paid vendor</text>  <text x="40" y="463.6" class="v ln" style="animation-delay:1.37s"><tspan fill="#39d353">&#9642; </tspan>Multi-tenant booking and clinic SaaS, Tap payments</text>  <text x="40" y="487.6" class="v ln" style="animation-delay:1.43s"><tspan fill="#39d353">&#9642; </tspan>Embeddable AI chatbot widget for WordPress and Salla</text>  <rect x="26" y="520.0" width="30" height="13" rx="2.5" fill="#161b22" class="ln" style="animation-delay:1.49s"/>  <rect x="61" y="520.0" width="30" height="13" rx="2.5" fill="#0e4429" class="ln" style="animation-delay:1.49s"/>  <rect x="96" y="520.0" width="30" height="13" rx="2.5" fill="#006d32" class="ln" style="animation-delay:1.49s"/>  <rect x="131" y="520.0" width="30" height="13" rx="2.5" fill="#26a641" class="ln" style="animation-delay:1.49s"/>  <rect x="166" y="520.0" width="30" height="13" rx="2.5" fill="#39d353" class="ln" style="animation-delay:1.49s"/>  <rect x="201" y="520.0" width="30" height="13" rx="2.5" fill="#69f0a0" class="ln" style="animation-delay:1.49s"/>  <rect x="236" y="520.0" width="30" height="13" rx="2.5" fill="#58a6ff" class="ln" style="animation-delay:1.49s"/>  <rect x="271" y="520.0" width="30" height="13" rx="2.5" fill="#c9d1d9" class="ln" style="animation-delay:1.49s"/>
</svg>
